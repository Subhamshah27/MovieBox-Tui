name: Desktop Windows Build

on:
  push:
    branches: [main, desktop-gui-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build desktop app
        run: cargo build --release --bin moviebox-desktop

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/moviebox-desktop.exe dist/
          @"
          MovieBox Desktop preview

          Run moviebox-desktop.exe to launch the graphical interface.
          This is an early UI preview. Provider search, streaming, playback,
          downloads and library actions are not connected yet.
          "@ | Set-Content dist/README.txt

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "packaging/windows/MovieBoxDesktop.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: moviebox-desktop-windows-preview
          path: |
            dist/moviebox-desktop.exe
            dist/README.txt
            dist/MovieBox-Desktop-Setup.exe
          if-no-files-found: error
